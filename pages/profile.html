<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
        <link rel="stylesheet" href="../styles/styles.css" />
    </head>
    <body>
        <header>
            <div class="container">
                <h2 class="name"><a href="/index.html">Локаливент</a></h2>

                                <nav>
                    <a href="/index.html">Главная</a>
                    <a href="/pages/all-events.html">Мероприятия</a>
                    <a href="/pages/my-events.html">Мои записи</a>
                    <a href="/pages/profile.html">
                        <img src="../resources/images/sakura-art.png" alt="Профиль" />
                    </a>
                </nav>
                <details class="mobile-menu">
                    <summary aria-label="Меню">
                        <span></span>
                        <span></span>
                        <span></span>
                    </summary>
                    <nav>
                        <a href="/index.html">Главная</a>
                        <a href="/pages/all-events.html">Мероприятия</a>
                        <a href="/pages/my-events.html">Мои записи</a>
                        <a href="/pages/profile.html" aria-label="Профиль">
                            <img src="../resources/images/sakura-art.png" alt="" />
                            <span>Профиль</span>
                        </a>
                    </nav>
                </details>
            </div>
        </header>

        <main>
            <div class="container">
                <h2>Привет, Пользователь!</h2>
            </div>

            <div class="update-user-data">
                <div class="update-avatar">
                    <img src="../resources/images/sakura-art.png" alt="Ваш текущий аватар" />
                    <div class="input-buttons">
                        <button class="accent-btn">Сменить аватар</button>
                        <button class="cancel">Удалить аватар</button>
                    </div>
                </div>

                <div class="input-section">
                    <div class="input-block">
                        <label for="username">Фамилия</label>
                        <input type="text" id="username" placeholder="Иванов" />
                    </div>
                    <div class="input-block">
                        <label for="firstname">Имя</label>
                        <input type="text" id="firstname" placeholder="Иван" />
                    </div>
                    <div class="input-block">
                        <label for="useremail">Почта</label>
                        <input type="email" id="useremail" placeholder="mail@example.com" />
                    </div>
                    <div class="input-block">
                        <label for="userphone">Телефон</label>
                        <input type="tel" id="userphone" placeholder="88005553535" />
                    </div>

                    <div class="input-block">
                        <label for="usercity">Город</label>
                        <input type="text" id="usercity" placeholder="Санкт-Петербург" />
                    </div>

                    <div class="input-buttons">
                        <button class="accent-btn">Сохранить изменения</button>
                        <button class="cancel">Отменить изменения</button>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
